<!DOCTYPE html>
<html lang='en'>

<body>
    <script>
        function findIndex(array, word) {
            for (let i = 0; i < array.length; i++){
                if (array[i] === word) {
                    return i;
                }
            }
            return -1;
        }

        function unique(array) {
            const result = [];
            for (let i = 0; i < array.length; i++) {
                if (findIndex(array.slice(0,i), array[i]) === -1){
                    result.push(array[i]);
                }
            }
            console.log(result);
        }

        function unique1(array) {
            const result = [];
            for (let i = 0; i < array.length; i++) {
                const word = array[i];
                if (findIndex(result, word) === -1) {
                    result.push(word);
                }
            }
            return result;
        }
        console.log(unique1(['green', 'red', 'blue', 'red']));
    </script>
</body>
