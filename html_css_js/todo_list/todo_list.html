<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <p>Todo List</p>
    <div class="menu-choice">
      <input
        placeholder="Todo Name"
        class="js-todo-name"
        onkeydown="
          if (event.key === 'Enter') {
            addTodo();
          }
        "
      />
      <input type="date" class="js-date-add" />
      <button type="button" class="btn bg-success text-white rounded-0" onclick="addTodo()">Add</button>
    </div>

    <div class="js-todo-list"></div>
    <input class="js-search" placeholder="Search" oninput="searchTodo();">
    <script>
      let todoList = JSON.parse(localStorage.getItem("todoList")) || [];
      renderTodoList();
      function addTodo() {
        const inputElement = document.querySelector(".js-todo-name");
        const name = inputElement.value;
        const inputDateElement = document.querySelector(".js-date-add");
        const dueDate = inputDateElement.value;
        todoList.push({ name, dueDate });
        inputElement.value = "";
        renderTodoList();
        localStorage.setItem("todoList", JSON.stringify(todoList));
        console.log(todoList);
      }

      function renderTodoList() {
        let todolistHTML = "";
        for (let i = 0; i < todoList.length; i++) {
          const todo = todoList[i];
          const html = `
                  <div class = "todo-row">
                    <p class="todo-name">${todo.name}</p> 
                    <p>${todo.dueDate}</p>
                    <button class = "border-0 bg-danger w-100 h-100 text-white" onclick="
                    todoList.splice(${i}, 1);
                    localStorage.setItem('todoList', JSON.stringify(todoList));
                    renderTodoList();">Delete</button>
                  </div>   
                  `;
          todolistHTML += html;
        }
        document.querySelector(".js-todo-list").innerHTML = todolistHTML;
      }

      function searchTodo() {
        const keyword = document.querySelector('.js-search').value.toLowerCase();
        const rows = document.querySelectorAll('.todo-row');
        rows.forEach(row => {
          const todoName = row.querySelector(".todo-name").textContent.toLowerCase();
          if (todoName.includes(keyword)) {
            row.style.display = "grid";
          } else {
            row.style.display = "none";
          }
        })
      }
    </script>
  </body>
</html>
